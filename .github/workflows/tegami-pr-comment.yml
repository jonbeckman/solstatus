name: Tegami PR Comment

on:
  workflow_run:
    workflows:
      - Tegami PR Preview
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

# A newer preview of the same branch replaces the comment, so it cancels an older one.
concurrency:
  group: tegami-pr-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    # workflow_run is a low-trust trigger. The comment job only reads the
    # dependency cache.
    cache-mode: read
    uses: SolZeroAI/.github/.github/workflows/tegami-pr-comment.yml@master
    with:
      runs-on: '"ubuntu-latest"'
