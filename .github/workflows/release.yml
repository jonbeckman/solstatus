name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

# The release of a version commit has its own group. A newer pending run in one group
# replaces the older pending run, so a later master merge must not replace the only run
# that publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ startsWith(github.event.workflow_run.head_commit.message, 'Version Packages') && '-publish' || '' }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish npm packages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Writes go through the release app token. This job's GITHUB_TOKEN stays read-only.
    # id-token: write stays for the npm publish step.
    permissions:
      contents: read
      id-token: write
    steps:
      # The app opens tegami/version-packages, so pull_request workflows start.
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Credentials stay in the checkout so the v* tag push uses this token.
          token: ${{ steps.release-token.outputs.token }}

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.6
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Build
        run: nub run build

      # Only the merge of the Tegami version pull request publishes, because only its Validate
      # run tests the release. Another master push only opens or updates the version pull
      # request. To publish again after a failure, re-run the Release run of the version commit.
      - name: Version or publish release
        run: |
          if [ "$RELEASE_COMMIT" = "true" ]; then
            nub run tegami ci
          else
            nub run tegami version --no-checks
          fi
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_COMMIT: ${{ startsWith(github.event.workflow_run.head_commit.message, 'Version Packages') && github.event.workflow_run.head_commit.author.email == '341870119+solzero-bot[bot]@users.noreply.github.com' }}
