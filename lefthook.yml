# Runs the fast repository checks before a push, so a lint, type or format error fails
# here and not in CI. Skip once with `git push --no-verify` or `LEFTHOOK=0 git push`.
# `nub install` installs the hook (the `prepare` script).
pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: nub run typecheck
    - name: lint
      run: nub run lint
    - name: format
      run: nub run format
